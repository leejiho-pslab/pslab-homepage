name: supabase keepalive (무료 플랜 자동 일시정지 방지)

# Supabase 무료 플랜은 프로젝트에 일정 기간 요청이 없으면 자동으로 일시정지된다.
# 정지되면 문의 저장·어드민 로그인이 멈추고, 운영자가 대시보드에서 수동으로
# 재개해야 한다. 문의가 뜸한 주에도 그런 일이 없도록 주 2회 사이트의 상태확인
# 주소를 호출해 DB 활동을 유지한다.
#
# 시크릿이 필요 없다 — 실제 DB 호출은 사이트 서버(Vercel 환경변수)에서 이뤄지고,
# 이 워크플로는 공개 주소를 호출하기만 한다.

on:
  schedule:
    # 매주 월·목 00:10 UTC (한국시간 09:10) — Supabase 정지 기준보다 훨씬 짧은 간격
    - cron: "10 0 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 상태확인 호출
        run: |
          set -o pipefail
          URL="https://pslab.ai.kr/api/health"

          # 배포 직후/일시적 네트워크 문제로 인한 오탐을 막기 위해 최대 3회 재시도
          for i in 1 2 3; do
            echo "시도 $i …"
            CODE=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 "$URL" || echo "000")
            echo "HTTP $CODE"
            cat body.json 2>/dev/null || true
            echo ""

            if [ "$CODE" = "200" ] && grep -q '"ok":true' body.json; then
              # DB가 아직 연결되지 않은 상태(not_configured)는 실패가 아니지만,
              # 조용히 넘기면 셋업 누락을 놓치므로 경고로 남긴다.
              if grep -q '"db":"not_configured"' body.json; then
                echo "::warning::Supabase 환경변수가 설정되지 않아 keepalive가 실제 DB에 닿지 않았습니다."
              else
                echo "✅ Supabase 활동 유지 완료"
              fi
              exit 0
            fi

            [ $i -lt 3 ] && sleep 20
          done

          echo "::error::상태확인 실패 — 사이트 또는 Supabase에 접근할 수 없습니다 ($URL). Supabase 대시보드에서 프로젝트가 일시정지되었는지 확인하세요."
          exit 1
